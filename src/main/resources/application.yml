spring:
  application:
    name: ieee-patrimonio
  datasource:
    url: ${PATRIMONIO_DB_URL:jdbc:h2:file:./data/patrimonio;DB_CLOSE_ON_EXIT=FALSE}
    username: ${PATRIMONIO_DB_USER:sa}
    password: ${PATRIMONIO_DB_PASSWORD:}
  sql:
    init:
      mode: always
  jackson:
    time-zone: America/Sao_Paulo
server:
  address: ${BIND_ADDRESS:127.0.0.1}
  port: ${PORT:8081}
  error:
    include-message: never
    include-stacktrace: never
  compression:
    enabled: true
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: strict
        secure: ${SESSION_COOKIE_SECURE:false}
patrimonio:
  hub-url: ${HUB_URL:http://localhost:8080}
  seed-demo: ${SEED_DEMO:true}
directory:
  url: ${LLDAP_LDAP_URL:ldap://localhost:3890}
  base-dn: ${LLDAP_BASE_DN:dc=ieeeiffcampos,dc=com,dc=br}
  bind-dn: ${LLDAP_BIND_DN:}
  bind-password: ${LLDAP_BIND_PASSWORD:}
  director-group: ${LLDAP_DIRECTOR_GROUP:ieee_diretoria}
  admin-group: ${LLDAP_ADMIN_GROUP:lldap_admin}
  web-url: ${LLDAP_WEB_URL:https://sso.ieeeiffcampos.com.br}
  api-url: ${LLDAP_API_URL:}
  api-username: ${LLDAP_API_USERNAME:}
  api-password: ${LLDAP_API_PASSWORD:}
